[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spidy-agents"
version = "1.0.0"
description = "Multi-agent autonomous Forex trading system using Gemini 2.0 + MetaTrader 5"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Spidy Team", email = "contact@example.com"}
]
keywords = ["trading", "forex", "agents", "automation", "AI", "gemini", "mt5"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "MetaTrader5>=5.0.40",
    "pandas>=2.0.0",
    "pandas-ta>=0.3.14b",
    "numpy>=1.24.0",
    "google-generativeai>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
]
monitoring = [
    "influxdb-client>=1.18.0",
]
all = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "influxdb-client>=1.18.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/spidy"
Documentation = "https://github.com/yourusername/spidy/wiki"
Repository = "https://github.com/yourusername/spidy.git"
Issues = "https://github.com/yourusername/spidy/issues"

[project.scripts]
spidy = "agents.orchestrator:main"

[tool.setuptools]
packages = ["agents"]
package-dir = {"" = "spidy_ai"}

[tool.setuptools.package-data]
agents = ["settings.yaml", "*.py"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-select = ["E", "W", "F", "I"]
ignore = ["E501"]  # line too long (handled by formatter)

[tool.ruff.isort]
known-first-party = ["agents", "spidy_ai"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.black]
line-length = 100
target-version = ["py39"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''
